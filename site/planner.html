<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>模拟构筑 · 破誓资料库</title>
<meta name="description" content="《破誓》构筑模拟器：按游戏数据计算词条、天赋、辅助宝石与技能的伤害，导入/导出游戏构筑代码，实时显示 DPS。">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/planner.css">
</head>
<body class="page-planner">
<header id="bo-top"></header>
<div class="wrap">
  <section class="hero plan-hero">
    <div class="hero-kicker">BUILD PLANNER</div>
    <h1>模拟构筑</h1>
    <p>按游戏数据实时结算装备词缀、局部伤害、天赋、龙裔、辅助宝石、誓约、诅咒与异常状态。导入游戏 <code>BO1.</code> 代码或本站 <code>BO2.</code> 完整代码时会先显示导入报告，再给出该构筑的技能 DPS；非法词缀、孔位、辅助与点数会被标出。</p>
  </section>

  <div class="plan-top">
    <div class="plan-id">
      <input id="pl-title" class="plan-input plan-title" maxlength="40" placeholder="构筑名称" aria-label="构筑名称">
      <select id="pl-class" class="sel" aria-label="职业"></select>
      <label class="plan-lv">等级 <input id="pl-level" type="number" min="1" max="100" step="1" aria-label="角色等级"></label>
      <span class="plan-pts" id="pl-points"></span>
    </div>
    <div class="plan-dps">
      <div class="plan-dps-main"><b id="pl-dps">0</b><span>最高技能 DPS</span></div>
      <div class="plan-dps-sub"><b id="pl-dpseff">0</b><span>计入抗性后的有效 DPS</span></div>
      <div class="plan-dps-sub"><b id="pl-model">0</b><span>游戏模型 DPS（对齐同一裂隙等级）</span></div>
    </div>
    <div class="plan-code">
      <button class="bo-btn plan-btn" id="pl-import-open">导入构筑代码</button>
      <button class="bo-btn plan-btn" id="pl-export">导出代码</button>
      <button class="bo-btn plan-btn" id="pl-demo">示例构筑</button>
      <button class="bo-btn plan-btn" id="pl-reset">清空</button>
    </div>
  </div>

  <div class="plan-grid">
    <!-- 装备 -->
    <section class="plan-col plan-col-gear">
      <div class="plan-head"><h2>装备</h2><span id="pl-gear-hint" class="plan-note"></span></div>
      <div id="pl-gear" class="gear-list"></div>
    </section>

    <!-- 技能 -->
    <section class="plan-col plan-col-skills">
      <div class="plan-head">
        <h2>技能与辅助</h2>
        <span id="pl-bar-hint" class="plan-note"></span>
        <button class="bo-btn plan-mini" id="pl-add-skill">+ 添加技能</button>
      </div>
      <div id="pl-skills" class="skill-list"></div>
      <div class="plan-head" style="margin-top:14px"><h2>誓约 / 先驱</h2><span class="plan-note">点击开关，生效后提供词条与保留</span></div>
      <div id="pl-vows" class="vow-list"></div>
      <div class="plan-head" style="margin-top:14px"><h2>诅咒 / 判决</h2><span class="plan-note">作用于目标，不改变面板数字</span></div>
      <div id="pl-curses" class="vow-list"></div>
    </section>

    <!-- 属性 / 防御 -->
    <section class="plan-col plan-col-stats">
      <div class="plan-head"><h2>属性与防御</h2></div>
      <div id="pl-stats" class="stat-panel"></div>
      <div class="plan-head" style="margin-top:14px"><h2>计算设置</h2></div>
      <div id="pl-cfg" class="cfg-panel"></div>
      <div class="plan-head" style="margin-top:14px"><h2>提示与冲突</h2><span id="pl-warn-n" class="plan-note"></span></div>
      <div id="pl-warn" class="warn-panel"></div>
    </section>
  </div>

  <!-- 天赋 -->
  <section class="plan-tree-sec">
    <div class="plan-head">
      <h2>天赋树 / 龙裔</h2>
      <div class="plan-tabs" role="tablist">
        <button class="tab" data-tab="tree" aria-selected="true">天赋树</button>
        <button class="tab" data-tab="dragon" aria-selected="false">龙裔</button>
        <button class="tab" data-tab="list" aria-selected="false">节点列表</button>
      </div>
      <span class="plan-pts" id="pl-tree-pts"></span>
    </div>
    <div id="pl-tree" class="tree-wrap">
      <div class="tree-ui">
        <input id="pl-tree-q" class="plan-input" style="width:190px" placeholder="搜索天赋节点…" aria-label="搜索天赋">
        <button class="bo-btn plan-mini" id="pl-tree-rec">推荐加点</button>
        <button class="bo-btn plan-mini" id="pl-tree-clear">清空</button>
        <button class="bo-btn plan-mini" id="pl-tree-fit">重置视图</button>
        <button class="bo-btn plan-mini" id="pl-tree-all">全览</button>
      </div>
      <svg id="pl-svg" aria-label="天赋树"></svg>
      <div class="legend" id="pl-legend">
        <span><i style="background:#e7b478"></i>已点</span>
        <span><i style="background:#6f6f76"></i>可点</span>
        <span><i style="background:#3a3a40"></i>未连通</span>
        <span><i style="background:#8fb0e8"></i>基石</span>
        <span><i style="background:#b4b4ff"></i>显著</span>
      </div>
      <div class="tree-panel" id="pl-tip"></div>
      <div class="tree-alt" id="pl-alt"></div>
    </div>
  </section>

  <section class="plan-doc">
    <h2>计算规则</h2>
    <div id="pl-doc"></div>
  </section>
</div>
<div id="bo-foot"></div>

<!-- 弹窗 -->
<div class="plan-toast" id="pl-toast"></div>
<div class="plan-modal" id="pl-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="plan-modal-box">
    <header><h3 id="pl-modal-title">标题</h3><button class="bo-btn plan-mini" id="pl-modal-x">关闭</button></header>
    <div class="plan-modal-body" id="pl-modal-body"></div>
    <footer id="pl-modal-foot"></footer>
  </div>
</div>

<script src="assets/site.js"></script>
<script src="assets/icons/manifest.js"></script>
<script src="assets/data/planner_core.js"></script>
<script src="assets/data/planner_items.js"></script>
<script src="assets/data/planner_tree.js"></script>
<script src="assets/planner.js"></script>
<script src="assets/planner_ui.js"></script>
</body>
</html>
