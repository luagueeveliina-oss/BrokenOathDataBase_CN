<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>物品库 · 破誓资料库</title>
<meta name="description" content="《破誓》物品数据库：传奇、底材、词缀、符文、珠宝、符文之语、药剂、神话词条与制作配方，可搜索与筛选。">
<link rel="stylesheet" href="assets/site.css">
</head>
<body class="page-items">
<header id="bo-top"></header>
<div class="wrap">
  <section class="hero" style="padding-bottom:12px">
    <div class="hero-kicker">ITEM DATABASE</div>
    <h1>物品库</h1>
    <p id="lede"></p>
  </section>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="toolbar">
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="搜索名称、词缀、风味文本…（按 / 聚焦）">
      <span class="kbd">/</span>
    </div>
    <select class="sel" id="sort"></select>
  </div>
  <div class="layout">
    <aside class="side" id="side"></aside>
    <div class="results">
      <div class="reshead"><div class="count" id="count"></div></div>
      <div id="list"></div>
    </div>
  </div>
</div>
<div id="bo-foot"></div>

<script src="assets/site.js"></script>
<script src="assets/icons/manifest.js"></script>
<script src="assets/data/items.js"></script>
<script>
(function(){
  const IT = window.BO_ITEMS, T = BO.T, esc = BO.esc, num = BO.num, hl = BO.hl;
  BO.mountHeader('items.html'); BO.mountFooter(); BO.setDocumentTitle('物品库','Items');
  const SL = {
    MainHand:['主手','Main Hand'], OffHand:['副手','Off Hand'], Helm:['头盔','Helm'], Chest:['胸甲','Chest'],
    Gloves:['手套','Gloves'], Boots:['靴子','Boots'], Belt:['腰带','Belt'], Amulet:['项链','Amulet'],
    Ring:['戒指','Ring'], Idol:['神像','Idol'], DwarvenRune:['矮人符文','Dwarven Rune'],
  };
  const slotZh = s => T(SL[s] || [s,s]);
  const modList = (arr, cls) => arr && arr.length ? `<ul class="mods ${cls||''}">${arr.map(m=>`<li>${hl(T(m))}</li>`).join('')}</ul>` : '';
  const nameLink = (cat,rec,colorCls) => {
    const id = rec.id || rec.Id;
    if (!id) return esc(T(rec.n));
    return `<a href="#${cat}/${encodeURIComponent(id)}" style="text-decoration:none;color:inherit">${hl(T(rec.n))}</a>`;
  };
  const dpsTag = (dps,def) => (dps?`<span class="tag dps">DPS <b>${num(dps,1)}</b></span>`:'') + (def?`<span class="tag def">防御 <b>${num(def)}</b></span>`:'');

  /* ---------- 图标 ---------- */
  const ROMAN = ['I','II','III','IV','V','VI'];
  const LADDER = new Map(IT.runes.concat(IT.jewels).map(x => [x.id, x]));
  const SLOT_GLYPH = {MainHand:'weapon', OffHand:'shield', Helm:'helm', Chest:'chest', Gloves:'gloves',
    Boots:'boots', Belt:'belt', Ring:'ring', Amulet:'amulet', Idol:'idol', DwarvenRune:'rune'};
  const CLS_GLYPH = {Bow:'bow', Quiver:'quiver', Tome:'tome', Shield:'shield'};
  const glyphOf = r => CLS_GLYPH[r.cls] || SLOT_GLYPH[r.slot] || 'weapon';
  const JEWEL_SLOTS = {Ring:1, Amulet:1, Belt:1, Idol:1};
  const tintOfBase = b => JEWEL_SLOTS[b.slot] ? '#cbb27f' : (b.slot === 'MainHand' || b.slot === 'OffHand' ? '#c3cdda' : '#aeb7c4');
  const boostHex = (hex, a) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return '#c9a06a';
    const n = parseInt(m[1], 16), mix = c => Math.round(c + (255 - c) * a);
    return `rgb(${mix(n >> 16 & 255)},${mix(n >> 8 & 255)},${mix(n & 255)})`;
  };

  // ---------------- category cards ----------------
  const CARDS = {
    uniques(u){
      const forged = (u.forged||[]).map((v,i)=>v>1?i:-1).filter(i=>i>=0);
      const tile = u.slot === 'Idol' ? (idolTile(u.baseId) || []) : [];
      const idolSize = u.slot === 'Idol' ? (((BASE_MAP.get(u.baseId) || {}).size) || '') : '';
      return `<article class="card u">
        <div class="card-head">${BO.icon('u:' + u.id, glyphOf(u), '#cd8f52', tile[0], tile[1])}<h3>${nameLink('uniques',u)}</h3><span class="lvl">Lv ${u.lvl}</span></div>
        <div class="sub"><b>${hl(T(u.base))}</b>${idolSize?' · 尺寸 '+esc(idolSize.replace('x','×')):''} · ${esc(T([u.clsZh,u.cls]))}${T([u.clsZh,u.cls])!==T([u.slotZh,u.slot])?' · '+esc(T([u.slotZh,u.slot])):''}</div>
        <div class="card-foot" style="border:0;padding:0;margin:0 0 8px">
          <span class="tag tier">红色阶级 ${(ROMAN[u.tier] || 'I'.repeat(u.tier))}</span>
          ${dpsTag(u.dps, u.cls!=='Ring'&&u.cls!=='Amulet'&&u.cls!=='Belt'?u.def:0)}
          ${forged.length?`<span class="tag hi">可烬铸 ${forged.map(i=>'第'+(i+1)+'条').join('、')}</span>`:''}
          ${u.drop?`<span class="tag">掉率权重 ${u.drop}</span>`:''}
        </div>
        ${modList(u.mods)}
        ${u.flav[1]?`<div class="flav"><em>风味</em>${hl(T(u.flav))}</div>`:''}
      </article>`;
    },
    bases(b){
      const req=[];
      if(b.req.str)req.push(`力量 ${b.req.str}`); if(b.req.dex)req.push(`敏捷 ${b.req.dex}`); if(b.req.int)req.push(`智力 ${b.req.int}`);
      const stats=[];
      if(b.dmg)stats.push(`${b.dmg[0]}–${b.dmg[1]} 物理伤害`);
      if(b.aps)stats.push(`${b.aps} 攻击/秒`);
      if(b.crit)stats.push(`${b.crit}% 暴击率`);
      if(b.ar)stats.push(`${b.ar} 护甲`);
      if(b.ev)stats.push(`${b.ev} 闪避值`);
      if(b.es)stats.push(`${b.es} 能量护盾`);
      if(b.block)stats.push(`${b.block}% 格挡`);
      return `<article class="card">
        <div class="card-head">${BO.icon('b:' + b.id, glyphOf(b), tintOfBase(b))}<h3>${nameLink('bases',b)}</h3><span class="lvl">Lv ${b.lvl}</span></div>
        <div class="sub"><b>${esc(T([b.clsZh,b.cls]))}</b>${b.twoh?' · 双手':''} · 占用 ${b.size}</div>
        <div class="card-foot" style="border:0;padding:0;margin:0 0 8px">${dpsTag(b.dps, b.def)}
          ${b.block?`<span class="tag">${b.block}% 格挡</span>`:''}
          ${b.nw?'<span class="tag">可开孔</span>':''}</div>
        ${stats.length?`<ul class="mods imp">${stats.map(s=>`<li>${s}</li>`).join('')}</ul>`:''}
        ${b.impl.length?`<div style="margin-top:8px"><span class="tag hi">固有词缀</span>${modList(b.impl)}</div>`:''}
        <div class="card-foot">${req.length?`<span>需求：${req.join(' · ')}</span>`:'<span>无属性需求</span>'}
          ${b.drop?`<span>掉落权重 ${b.drop}</span>`:''}${b.nw?'<span class="tag">可开孔</span>':''}</div>
      </article>`;
    },
    runes(r){
      const isJewel = r.kind === 'jewel';
      return `<article class="card">
        <div class="card-head">${BO.icon((isJewel ? 'j:' : 'r:') + r.id, isJewel ? 'jewel' : 'rune', boostHex(r.color, isJewel ? 0.12 : 0.45))}<h3>${nameLink('runes',r)}</h3><span class="lvl">Lv ${r.lvl}</span></div>
        <div class="sub">${r.kind==='jewel'?'珠宝':'符文'} · 阶级 ${r.tier}${r.lore[1]?' · '+hl(T(r.lore)):''}</div>
        <hr style="border:0;border-top:1px solid var(--line);margin:6px 0">
        <div style="font-size:.72rem;letter-spacing:.14em;color:var(--dim);text-transform:uppercase">嵌入武器</div>
        ${modList(r.w)}
        <div style="font-size:.72rem;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:8px">嵌入护甲</div>
        ${modList(r.a)}
        <div class="card-foot">${r.next
          ? `<span>可升级为 <b style="color:var(--acc2)">${esc(T((LADDER.get(r.next) || {}).n || r.next))}</b></span>`
          : `<span>${r.kind === 'jewel' ? '珠宝' : '符文'}阶梯顶端</span>`}<span>掉落权重 ${r.weight}</span></div>
      </article>`;
    },
    runewords(w){
      return `<article class="card rw">
        <div class="card-head"><h3>${nameLink('runewords',w)}</h3><span class="lvl">Lv ${w.lvl}</span></div>
        <div class="sub"><b>${esc(T([w.clsZh,w.cls]))}</b>${w.build?' · '+hl(T([w.buildZh,w.build])):''}</div>
        <div style="font-family:var(--font-disp);color:var(--rune);font-size:1rem;letter-spacing:.04em">${w.runes.map(r=>esc(T(r))).join(' · ')}</div>
        <div class="card-foot" style="border:0;padding:0;margin:6px 0 8px">
          <span class="tag">${w.sockets} 孔</span>
          ${w.bases.map(b=>`<span class="tag">${esc(T(b))}</span>`).join('')}
        </div>
        ${modList(w.mods)}
        ${w.power.length?`<div style="font-size:.72rem;letter-spacing:.14em;color:var(--rune);margin-top:10px">注入奖励</div>${modList(w.power,'pow')}`:''}
        ${(w.bands||[]).length?`<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--dim);font-size:.8rem">阶级强化（物品等级 ${w.bands.map(b=>b.ilvl).filter(Boolean).join(' / ')}）</summary>${w.bands.map(b=>`<div style="margin:6px 0 0;font-size:.78rem;color:var(--dim)">物品等级 ${b.ilvl}+</div>${modList(b.lines)}`).join('')}</details>`:''}
        ${w.flav[1]?`<div class="flav"><em>风味</em>${hl(T(w.flav))}</div>`:''}
      </article>`;
    },
    potions(p){
      const ch = (IT.potions.charges||[]).find(c=>c.role===p.role) || {};
      const chTxt = ch.max ? (p.role==='Utility'
        ? `${ch.max} 充能 · 每次 ${ch.use} · 持续 ${ch.dur}s`
        : `${ch.max} 充能 · 每次 ${ch.use}`) : '';
      return `<article class="card">
        <div class="card-head"><h3>${esc(T(p.n))}</h3><span class="lvl">${esc(T([p.roleZh,p.role]))}</span></div>
        <div class="sub">${p.rec?`回复 ${p.rec}% · ${p.sec}s`:(p.ward?`饮用回复 ${p.ward}% 生命与护盾`:'功能药剂')} · 权重 ${p.weight??'—'}${chTxt?' · '+chTxt:''}</div>
        ${p.text[1]?`<div style="color:var(--fg2);font-size:.9rem">${hl(T(p.text))}</div>`:''}
        ${modList(p.mods)}
      </article>`;
    },
    vessel(v){
      return `<article class="card">
        <div class="card-head"><h3>${esc(T(v.n))}</h3><span class="lvl">RL ${v.minrl}+</span></div>
        <div class="sub">${v.pre} 前缀 · ${v.suf} 后缀${v.oath?' · 誓约位':''}${v.core?' · 核心':''}</div>
      </article>`;
    },
    potionmod(m){
      return `<article class="card">
        <div class="card-head"><h3>${esc(T(m.n))}</h3><span class="lvl">${esc(T([m.kindZh,m.kind]))}</span></div>
        <div class="sub">${(m.rolesZh||[]).map(r=>esc(r)).join(' / ')}</div>
        <table><thead><tr><th>阶级</th><th>解锁 RL</th><th>效果</th></tr></thead><tbody>
        ${m.tiers.map(t=>`<tr><td class="mono">T${t.tier}</td><td class="mono">${t.minrl}</td><td>${esc(t.line)}</td></tr>`).join('')}
        </tbody></table>
      </article>`;
    },
    potionunique(u){
      return `<article class="card u">
        <div class="card-head"><h3>${esc(T(u.n))}</h3><span class="lvl">${esc(u.typeN ? T(u.typeN) : '')}</span></div>
        <div class="sub">来源 ${esc(u.sourceZh || u.source || '—')}${u.later ? ' · 后续版本' : ''}</div>
        <div style="color:var(--fg2);font-size:.9rem">${esc(T(u.text))}</div>
      </article>`;
    },
    idol(x){
      if (x.t === 'uniq') return CARDS.uniques(x.u);
      if (x.t === 'recipe') return cubeCard(x.c);
      const b = x.b, size = (b.size || '1x1').replace('x', '×');
      const tiles = idolTile(b.id) || [];
      const tier = (b.tags || []).map(t => Array.isArray(t) ? t[1] : t).find(t => String(t).startsWith('Idol') && t !== 'Idol') || '';
      return `<article class="card">
        <div class="card-head">${BO.icon('b:' + b.id, 'idol', '#cbb27f', tiles[0], tiles[1])}<h3>${esc(T(b.n))}</h3><span class="lvl">Lv ${b.lvl}</span></div>
        <div class="sub">神像 · 尺寸 ${esc(size)} · 掉落权重 ${b.drop ?? '—'}</div>
        <div class="sub">词缀池 ${esc(IDOL_TAG_ZH[tier] || tier)}</div>
      </article>`;
    },
  };

  const MAT_NAME = new Map((IT.materials||[]).map(m=>[m.id, m.n]));
  const matName = id => { const n = MAT_NAME.get(id); return n ? T(n) : (id || ''); };
  const BASE_MAP = new Map(IT.bases.map(b=>[b.id, b]));
  // 神像按占格比例给图标：1×4 用高框，4×1 用宽框，避免被裁成一条
  const idolTile = id => {
    const b = BASE_MAP.get(id);
    if (!b) return null;
    const [w, h] = (b.size || '1x1').split('x').map(Number);
    return [Math.min(72, Math.max(24, w * 24)), Math.min(72, Math.max(24, h * 24))];
  };

  const IDOL_BASES = IT.bases.filter(b => b.slot === 'Idol');
  const IDOL_UNIQUES = IT.uniques.filter(u => ((u.base || [])[1] || '').toLowerCase().includes('idol'));
  const IDOL_RECIPES = IT.cube.filter(c => c.id.startsWith('idol'));
  const IDOL_TAG_ZH = {Idol1:'一阶', Idol2:'二阶', Idol3:'三阶', Idol4:'四阶', IdolGrand:'先祖'};
  function idolRules(){
    const aff = IT.affixes.filter(a => (a.on || []).some(t => String(t).startsWith('Idol')));
    const byTag = {};
    aff.forEach(a => (a.on || []).filter(t => String(t).startsWith('Idol')).forEach(t => { byTag[t] = (byTag[t] || 0) + 1; }));
    const sizeRows = IDOL_BASES.map(b => {
      const tier = (b.tags || []).map(t => Array.isArray(t) ? t[1] : t).find(t => String(t).startsWith('Idol') && t !== 'Idol') || '';
      return `<tr><td>${esc(T(b.n))}</td><td class="mono">${esc((b.size || '1x1').replace('x', '×'))}</td><td>${esc(IDOL_TAG_ZH[tier] || tier)}</td><td class="mono">${b.drop ?? '—'}</td></tr>`;
    }).join('');
    const tagChips = Object.keys(byTag).sort().map(t => `<span class="chip">${esc(IDOL_TAG_ZH[t] || t)} ${byTag[t]}</span>`).join('');
    const recRows = IDOL_RECIPES.map(c => `<div style="margin:4px 0"><b style="color:var(--gold)">${esc(T(c.n))}</b>：${esc(T(c.recipe))}</div>`).join('');
    return `<div class="facet"><h4>神像槽</h4><div class="alist">
      <details class="arow" open><summary><span class="txt">尺寸与词缀池（${IDOL_BASES.length} 种）</span></summary><div class="tiers"><table><thead><tr><th>神像</th><th>尺寸</th><th>词缀池</th><th>权重</th></tr></thead><tbody>${sizeRows}</tbody></table></div></details>
      <details class="arow"><summary><span class="txt">词缀池（${aff.length} 条）</span></summary><div class="tiers"><div class="chips">${tagChips}</div><div style="color:var(--dim);font-size:.78rem;margin-top:6px">词缀按神像尺寸分池，完整词缀见「词缀」页（可按神像筛选）。</div></div></details>
      <details class="arow"><summary><span class="txt">神像工艺（${IDOL_RECIPES.length} 条，见魔方配方）</span></summary><div class="tiers" style="font-size:.8rem;color:var(--fg2);line-height:1.7">${recRows}<div style="color:var(--dim);margin-top:6px">这三条是魔方配方（工艺），不是神像本身；神像占 1–4 格，产物见「魔方配方」页。</div></div></details>
    </div></div>`;
  }
  const POT_COST_ZH = {Equip:'装备', Steep:'浸泡', Distil:'蒸馏', ResteepMagic:'重浸泡（魔法）',
    ResteepRare:'重浸泡（稀有）', Tincture:'酊剂', Seal:'封印', Oath:'誓约', Core:'核心',
    Pour:'浇灌', QualityPer2:'每 2% 品质', QualityMax:'品质上限'};
  function potionRules(){
    const P = IT.potions, pct = v => v==null ? '—' : Math.round(v*100)+'%';
    const KEY_ZH = {LifeFlask:'生命药剂', ManaFlask:'魔力药剂', UtilityPotion1:'功能药剂 1', UtilityPotion2:'功能药剂 2'};
    const RAR_ZH = {Normal:'普通', Magic:'魔法', Rare:'稀有', Unique:'传奇'};
    const potName = id => { const t=P.types.find(x=>x.id===id); return t ? T(t.n) : id; };
    const modName = id => { const m=P.mods.find(x=>x.id===id); return m ? T(m.n) : id; };
    const slotRows = (P.slots||[]).map(s=>`<tr><td class="mono">${s.slot+1}</td><td>${esc(T([s.roleZh,s.role]))}</td><td class="mono">RL ${s.open}+</td><td>${esc(KEY_ZH[s.key]||s.key)}</td></tr>`).join('');
    const chgRows = (P.charges||[]).map(c=>`<tr><td>${esc(T([c.roleZh,c.role]))}</td><td class="mono">${c.max}</td><td class="mono">${c.use}</td><td class="mono">${Array.isArray(c.kill)?c.kill.join(' / '):c.kill}</td><td class="mono">${c.dur?c.dur+'s':'—'}</td></tr>`).join('');
    const costRows = (P.costs||[]).map(c=>{
      const label = esc(POT_COST_ZH[c.id]||c.id);
      if (typeof c.items === 'number') return `<tr><td>${label}</td><td>${c.items}%</td></tr>`;
      const items = Object.entries(c.items||{}).map(([k,v])=>`${v} ${esc(matName(k))}`).join('、');
      return `<tr><td>${label}</td><td>${items||'免费'}</td></tr>`;
    }).join('');
    const vesRows = (P.vessels||[]).map(v=>`<tr><td>${esc(T(v.n))}</td><td class="mono">RL ${v.minrl}+</td><td class="mono">${v.pre} / ${v.suf}</td><td>${v.oath?'誓约 ':''}${v.core?'核心':''}${!v.oath&&!v.core?'—':''}</td></tr>`).join('');
    const d = P.drops||{}, u = P.unlock||{};
    const dropsHtml = `掉落自 RL ${d.MinRL}+；魔法 ${pct((d.Chance||{}).Magic)} · 稀有 ${pct((d.Chance||{}).Rare)} · 守护者 ${pct((d.Chance||{}).Guardian)} · 首领 ${pct((d.Chance||{}).Boss)}<br>
      普通/魔法/稀有 权重 ${(d.RarityWeights||{}).Normal??'—'} / ${(d.RarityWeights||{}).Magic??'—'} / ${(d.RarityWeights||{}).Rare??'—'}，守护者 ${(d.GuardianRarityWeights||{}).Magic??'—'} / ${(d.GuardianRarityWeights||{}).Rare??'—'}<br>
      传奇几率：守护者 ${pct((d.UniqueChance||{}).Guardian)} · 核心 ${pct((d.UniqueChance||{}).Core)} · 墓穴 ${pct((d.UniqueChance||{}).Catacombs)}；核心铸造 ${pct(d.CoreForgedChance)}`;
    const unlockHtml = `首次出现 RL ${u.Tease} · 开放 RL ${u.Open} · 第四槽 RL ${u.Slot4}；赠礼：${esc(potName(u.GiftType))}（${esc(RAR_ZH[u.GiftRarity]||u.GiftRarity||'')}，含 ${(u.GiftMods||[]).map(x=>esc(modName(x))).join('、')}）`;
    return `<div class="facet"><h4>药瓶</h4><div class="alist"><details class="arow"><summary><span class="txt">前缀 / 后缀 / 特殊位</span></summary><div class="tiers"><table><tbody>${vesRows}</tbody></table></div></details></div></div>
      <div class="facet"><h4>规则</h4><div class="alist">
        <details class="arow"><summary><span class="txt">槽位</span></summary><div class="tiers"><table><thead><tr><th>槽</th><th>类型</th><th>解锁</th><th>按键</th></tr></thead><tbody>${slotRows}</tbody></table></div></details>
        <details class="arow"><summary><span class="txt">充能</span></summary><div class="tiers"><table><thead><tr><th>类型</th><th>上限</th><th>每次</th><th>击杀获得</th><th>持续</th></tr></thead><tbody>${chgRows}</tbody></table></div></details>
        <details class="arow"><summary><span class="txt">浇灌条件</span></summary><div class="tiers"><div class="chips">${(P.pour||[]).map(p=>`<span class="chip">${esc(T(p.n))}</span>`).join('')}</div></div></details>
        <details class="arow"><summary><span class="txt">制作成本</span></summary><div class="tiers"><table><tbody>${costRows}</tbody></table></div></details>
        <details class="arow"><summary><span class="txt">掉落</span></summary><div class="tiers" style="font-size:.78rem;line-height:1.9;color:var(--dim)">${dropsHtml}</div></details>
        <details class="arow"><summary><span class="txt">解锁</span></summary><div class="tiers" style="font-size:.8rem;line-height:1.8;color:var(--dim)">${unlockHtml}</div></details>
      </div></div>`;
  }

  const CUBE_CLS = {'物品':'items', '红色阶级':'reds', '符文':'runes', '珠宝':'jewels'};
  const cubeCard = c => {
    const fam = CUBE_CLS[c.family] || 'items';
    return `<article class="card cube-${fam}">
      <div class="card-head"><h3>${esc(T(c.n))}</h3><span class="lvl">${esc(c.family||'')}</span></div>
      <div class="sub">${esc(T(c.recipe))}</div>
      ${modList([c.result,c.makes,c.uses,c.keeps].filter(x=>x&&x[1]))}
      ${c.hint && (c.hint[0] || c.hint[1])
        ? `<div class="flav"><em>提示</em>${esc(T(c.hint))}</div>`
        : ''}
    </article>`;
  };

  const forgeCard = f => `<article class="card">
      <div class="card-head"><h3>${esc(T(f.n))}</h3><span class="lvl">${esc(T([f.kindZh,f.kind]))}</span></div>
      <div class="sub">${f.mat?`消耗 ${esc(matName(f.mat))} ×${f.cost}`:''}${f.mat2?` + ${esc(matName(f.mat2))} ×${f.cost2}`:''}</div>
      <div style="color:var(--fg2);font-size:.9rem">${hl(T(f.text))}</div>
      ${f.line[1]?`<div class="flav"><em>铁匠</em>${esc(T(f.line))}</div>`:''}
      <div class="card-foot"><span>${esc(T(f.found))}</span>${(f.landNames||[]).length?`<span>${f.landNames.map(l=>esc(T(l))).join(' / ')}</span>`:''}</div>
    </article>`;

  const mythicCard = m => `<article class="card">
      <div class="card-head"><h3>${esc(T(m.n || [m.groupZh, m.group]))}</h3><span class="lvl">${esc(T([m.typeZh,m.type]))}</span></div>
      <div class="sub">神话物品专属词条 · 每件神话物品获得 1 条</div>
      ${m.tiers.some(t=>t.line)?`<ul class="mods">${m.tiers.filter(t=>t.line).map(t=>`<li>${esc(T(t.line))}</li>`).join('')}</ul>`:''}
      <div class="card-foot"><span>物品等级 ${m.tiers[0] && m.tiers[0].ilvl!=null?m.tiers[0].ilvl:'—'}</span><span>仅神话物品可获得（不入掉落池）</span></div>
    </article>`;

  const affixRow = a => `<details class="arow"><summary>
      <span class="ptype ${a.type==='Prefix'?'pre':'suf'}">${esc(T([a.typeZh,a.type]))}</span>
      <span><span class="txt">${hl(T(a.top))}</span><br><span class="on">${esc(a.groupZh)} · ${a.onZh.map(s=>esc(s)).join(', ')}${a.notOn.length?' · 不含 '+(a.notOnZh||a.notOn.map(slotZh)).map(s=>esc(s)).join(', '):''}</span></span>
      <span class="meta">${a.tiers.length} 阶级 · 物品等级 ${a.minIlvl}+</span></summary>
      <div class="tiers"><table><thead><tr><th>阶级</th><th>名号</th><th>物品等级</th><th>数值</th><th>权重</th></tr></thead><tbody>
      ${a.tiers.map((t,i)=>`<tr${i===0?' class="top"':''}><td class="mono">${t.t}</td><td>${hl(T(t.name))}</td><td class="mono">${t.ilvl}</td><td>${t.line?hl(T(t.line)):''}</td><td class="mono">${t.w??''}</td></tr>`).join('')}
      </tbody></table></div></details>`;

  // ---------------- categories ----------------
  const CATS = [
    {k:'uniques', zh:'传奇', en:'Uniques', arr:()=>IT.uniques, card:CARDS.uniques,
     facetDefs:[['slot','槽位',u=>[slotZh(u.slot)]],['cls','类型',u=>[T([u.clsZh,u.cls])]],['tier','红色阶级',u=>['红色阶级 '+u.tier]]],
     sort:['lvl','name','dps','def']},
    {k:'bases', zh:'底材', en:'Base items', arr:()=>IT.bases, card:CARDS.bases,
     facetDefs:[['slot','槽位',b=>[slotZh(b.slot)]],['cls','类型',b=>[T([b.clsZh,b.cls])]],['twoh','双手',b=>[b.twoh?'双手':'单手']]],
     sort:['lvl','name','dps','def']},
    {k:'idols', zh:'神像', en:'Idols',
     arr:()=>[
       ...IDOL_BASES.map((b,i)=>({t:'base', b, n:b.n, lvl:b.lvl, o:i})),
       ...IDOL_UNIQUES.map((u,i)=>({t:'uniq', u, n:u.n, lvl:u.lvl, o:100+i}))],
     card:CARDS.idol,
     facetDefs:[['t','类型',x=>[x.t==='base'?'底材':'传奇']]],
     sort:['order'], extra: idolRules()},
    {k:'affixes', zh:'词缀', en:'Item mods', arr:()=>IT.affixes, card:affixRow, row:true,
     facetDefs:[['type','类型',a=>[T([a.typeZh,a.type])]],['group','分组',a=>[a.groupZh]],['on','可出现在',a=>a.onZh.map(s=>T([slotZh(s),s]))]],
     sort:['lvl','name']},
    {k:'runes', zh:'符文', en:'Runes', arr:()=>IT.runes, card:CARDS.runes,
     facetDefs:[['tier','阶级',r=>['阶级 '+r.tier]],['next','有后继',r=>[r.next?'有后继':'阶梯顶端']]],
     sort:['lvl','idx','name']},
    {k:'jewels', zh:'珠宝', en:'Jewels', arr:()=>IT.jewels, card:CARDS.runes,
     facetDefs:[['tier','阶级',r=>['阶级 '+r.tier]]], sort:['lvl','idx','name']},
    {k:'runewords', zh:'符文之语', en:'Runewords', arr:()=>IT.runewords, card:CARDS.runewords,
     facetDefs:[['cls','职业',w=>[T([w.clsZh,w.cls]) || '通用']],['sockets','孔数',w=>[w.sockets+' 孔']],['base','可嵌入',w=>w.bases.map(b=>T(b))]],
     sort:['lvl','name']},
    {k:'potions', zh:'药剂', en:'Potions', arr:()=>IT.potions.types, card:CARDS.potions,
     facetDefs:[['role','类型',p=>[T([p.roleZh,p.role])]]], sort:['name'],
     extra: potionRules()},
    {k:'potuniques', zh:'传奇药剂', en:'Unique potions', arr:()=>IT.potions.uniques, card:CARDS.potionunique,
     facetDefs:[['type','类型',u=>[T(u.typeN)||'—']],['source','来源',u=>[u.sourceZh||u.source||'—']]], sort:['name']},
    {k:'potmods', zh:'药剂词缀', en:'Potion mods', arr:()=>IT.potions.mods, card:CARDS.potionmod,
     facetDefs:[['kind','类别',m=>[T([m.kindZh,m.kind])]],['role','适用',m=>m.rolesZh.map(r=>T([r,r]))]], sort:['name']},
    {k:'cube', zh:'魔方配方', en:'Cube recipes', arr:()=>IT.cube, card:cubeCard,
     facetDefs:[['family','系列',c=>[c.family||'其他']]], sort:['name']},
    {k:'forge', zh:'锻造', en:'Forge', arr:()=>IT.forge, card:forgeCard,
     facetDefs:[['kind','类型',f=>[T([f.kindZh,f.kind])]],['group','分组',f=>[f.group||'其他']]], sort:['name']},
    {k:'mythic', zh:'神话词条', en:'Mythic lines', arr:()=>IT.mythic, card:mythicCard,
     facetDefs:[['type','类型',m=>[T([m.typeZh,m.type])]]], sort:['name']},
  ];

  const S = { cat:'uniques', q:'', sort:'rar', f:{}, pin:'' };
  let terms = [];
  const arrOf = k => (CATS.find(c=>c.k===k)||CATS[0]).arr();

  // search index
  CATS.forEach(c=>c.arr().forEach(r=>{ if(!r._s) r._s = JSON.stringify(r).toLowerCase(); }));

  // 支持 #分类 / #分类/物品id / #分类?分面=值&分面=值 / #分类?q=关键词
  function readHash(){
    const raw = decodeURIComponent(location.hash.slice(1));
    const qi = raw.indexOf('?');
    const path = qi < 0 ? raw : raw.slice(0, qi);
    const qs = qi < 0 ? '' : raw.slice(qi + 1);
    const i = path.indexOf('/');
    const cat = i < 0 ? path : path.slice(0, i);
    const id = i < 0 ? '' : path.slice(i + 1);
    const def = CATS.find(c => c.k === cat);
    if (!def) return false;
    S.cat = cat;
    S.pin = id && arrOf(cat).some(r => (r.id || r.Id) === id) ? id : '';
    S.f = {};
    S.q = '';
    if (qs) {
      const p = new URLSearchParams(qs);
      if (p.has('q')) S.q = (p.get('q') || '').trim();
      const valid = new Set((def.facetDefs || []).map(f => f[0]));
      for (const [k, v] of p) {
        if (k !== 'q' && valid.has(k) && v) (S.f[k] || (S.f[k] = new Set())).add(v);
      }
    }
    const qEl = document.getElementById('q');
    if (qEl) qEl.value = S.q;
    return true;
  }
  readHash();

  const $ = id => document.getElementById(id);

  // 顶栏搜索框跳转过来时带 ?q=…
  const q0 = (new URLSearchParams(location.search).get('q') || '').trim();
  if (q0) { S.q = q0; $('q').value = q0; }

  function filtered(k){
    const def = CATS.find(c=>c.k===k);
    let arr = def.arr();
    if (S.pin && k===S.cat) return arr.filter(r=>(r.id||r.Id)===S.pin);
    if (S.q) { const ts = S.q.toLowerCase().split(/\s+/).filter(Boolean); arr = arr.filter(r=>ts.every(t=>r._s.includes(t))); }
    for (const [fid,,fn] of (def.facetDefs||[])) {
      const set = S.f[fid];
      if (set && set.size) arr = arr.filter(r=>fn(r).some(v=>set.has(v)));
    }
    return arr;
  }

  function render(){
    terms = S.q.toLowerCase().split(/\s+/).filter(Boolean); BO.setTerms(S.q);
    const def = CATS.find(c=>c.k===S.cat);
    // tabs
    $('tabs').innerHTML = CATS.map(c=>`<button class="tab" role="tab" data-k="${c.k}" aria-selected="${c.k===S.cat}">${esc(T([c.zh,c.en]))}<i>${filtered(c.k).length}</i></button>`).join('');
    // facets
    const all = def.arr();
    const fdefs = def.facetDefs || [];
    const searchPool = S.pin ? [] : all.filter(r=>{
      if(!S.q) return true;
      const ts = S.q.toLowerCase().split(/\s+/).filter(Boolean);
      return ts.every(t=>r._s.includes(t));
    });
    const gs = fdefs.map(([id,label,fn])=>{
      const counts = new Map();
      searchPool.forEach(r=>fn(r).forEach(v=>counts.set(v,(counts.get(v)||0)+1)));
      return {id,label,values:counts,selected:S.f[id]||new Set(),display:v=>v};
    });
    BO.renderFacets($('side'), gs, (gid,val)=>{
      if (val===null){ delete S.f[gid]; }
      else { const s=S.f[gid]||(S.f[gid]=new Set()); s.has(val)?s.delete(val):s.add(val); }
      render();
    });
    $('side').insertAdjacentHTML('beforeend', def.extra||'');
    // 魔方「系列」分面用与卡片一致的颜色
    if (S.cat === 'cube') {
      $('side').querySelectorAll('.chip[data-v]').forEach(ch => {
        const fam = CUBE_CLS[ch.getAttribute('data-v')];
        if (fam) ch.classList.add('chip-' + fam);
      });
    }
    // sort options
    const sorts = {lvl:['等级：低到高','Level ↑'], lvlDesc:['等级：高到低','Level ↓'], name:['名称','Name'], dps:['伤害（DPS）','Damage (DPS)'], def:['防御值','Defence'], idx:['符文阶梯','Rune ladder'], order:['默认顺序','Default order'], rar:['稀有度','Rarity']};
    const sortKeys = ['rar'].concat((def.sort||['lvl']).filter(k=>k!=='rar'));
    const sortKey = sortKeys.includes(S.sort) ? S.sort : 'rar';
    S.sort = sortKey;
    $('sort').innerHTML = sortKeys.concat(['lvlDesc']).map(s=>`<option value="${s}">${esc(T(sorts[s]||[s,s]))}</option>`).join('');
    $('sort').value = sortKey;
    $('sort').setAttribute('data-cur', sortKey);
    // list
    let arr = filtered(S.cat).slice();
    const lv = r => r.lvl ?? r.minIlvl ?? 0;
    // 稀有度：传奇 4 / 符文·珠宝·符文之语 3·2 / 普通 1；合成与词缀 0
    const rarityOf = r => {
      if (r.t === 'uniq') return 4;
      if (r.t === 'base') return 1;
      if (r.t === 'recipe') return 0;
      if (typeof r.rarity === 'number') return r.rarity;
      if (S.cat === 'uniques' || S.cat === 'potuniques') return 4;
      if (S.cat === 'runewords') return 3;
      if (S.cat === 'runes' || S.cat === 'jewels') return 2;
      if (S.cat === 'bases' || S.cat === 'potions') return 1;
      return 0;
    };
    const tierOf = r => r.tier ?? (r.u ? r.u.tier : 0) ?? 0;
    if (S.sort==='rar') arr.sort((a,b)=> rarityOf(b)-rarityOf(a) || (tierOf(b)||0)-(tierOf(a)||0) || lv(a)-lv(b));
    else if (S.sort==='name') arr.sort((a,b)=>T(a.n||[a.groupZh||'',a.group||'']).localeCompare(T(b.n||[b.groupZh||'',b.group||''])));
    else if (S.sort==='order') arr.sort((a,b)=>(a.o??0)-(b.o??0));
    else if (S.sort==='dps') arr.sort((a,b)=>(b.dps||0)-(a.dps||0)||lv(a)-lv(b));
    else if (S.sort==='def') arr.sort((a,b)=>(b.def||0)-(a.def||0)||lv(a)-lv(b));
    else if (S.sort==='idx') arr.sort((a,b)=>(a.idx||0)-(b.idx||0));
    else if (S.sort==='lvlDesc') arr.sort((a,b)=>lv(b)-lv(a));
    else arr.sort((a,b)=>lv(a)-lv(b));
    $('count').innerHTML = S.pin && arr.length
      ? `正在查看 <b>${esc(T(arr[0].n))}</b> · <a href="#${S.cat}" style="color:var(--acc)">返回列表（共 ${num(def.arr().length)} 条）</a>`
      : `<b>${arr.length}</b> 条${esc(T([def.zh,def.en]))}${S.q?` · 匹配 “${esc(S.q)}”`:''}`;
    if (!arr.length){ $('list').innerHTML = BO.empty('没有匹配的结果。试试更少的关键词，或换一个分类标签。'); return; }
    $('list').innerHTML = def.row
      ? `<div class="alist">${arr.map(def.card).join('')}</div>`
      : `<div class="grid">${arr.map(def.card).join('')}</div>`;
    $('lede').textContent = S.pin ? '' : `共 ${all.length} 条${T([def.zh,def.en])}数据，全部来自游戏数据文件；支持中英文关键词搜索。`;
    BO.collapseSide();
  }

  $('tabs').addEventListener('click', e=>{
    const b=e.target.closest('.tab'); if(!b) return;
    S.cat=b.dataset.k; S.pin=''; S.f={}; S.q=''; S.sort='rar'; $('q').value='';
    history.replaceState(null,'','#'+S.cat); render(); window.scrollTo({top:0,behavior:'instant'});
  });
  $('q').addEventListener('input', BO.debounce(e=>{ S.q=e.target.value.trim(); S.pin=''; render(); },140));
  $('sort').addEventListener('change', e=>{ S.sort=e.target.value; render(); });
  document.addEventListener('keydown', e=>{
    if (e.key==='/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); $('q').focus(); }
    if (e.key==='Escape' && document.activeElement===$('q')){ $('q').value=''; S.q=''; render(); }
  });
  window.addEventListener('hashchange', ()=>{ readHash(); render(); window.scrollTo({top:0,behavior:'instant'}); });
  render();
})();
</script>
</body>
</html>
