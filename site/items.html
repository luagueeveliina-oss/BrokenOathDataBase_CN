<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>物品库 · Broken Oath Data Base</title>
<meta name="description" content="《破誓》物品数据库：182 件传奇、465 种底材、288 条词缀、符文、珠宝、符文之语、药剂、神像与魔方配方，可搜索与筛选。">
<link rel="stylesheet" href="assets/app.css">
<script>try{var t=localStorage.getItem('bo_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>
<header id="bo-top"></header>

<main id="main" class="wrap">
  <header class="pagehead">
    <div class="crumbs"><a href="index.html">首页</a><span class="sep">/</span><span>数据库</span><span class="sep">/</span><span>物品</span></div>
    <div class="ph-kicker">Item database</div>
    <div class="ph-row">
      <div>
        <h1 class="ph-title">物品库 <span class="thin">Items</span></h1>
        <p class="ph-sub" id="lede">传奇、底材、词缀、符文、珠宝、符文之语、药剂与神像。数据由本机游戏文件直接生成，支持中英文关键词、分面筛选与深链接。</p>
      </div>
      <div class="ph-actions"><span class="tag gold" id="itemVer">本地数据</span></div>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="物品分类"></nav>

  <div class="toolbar">
    <div class="searchbox">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="搜索名称、词缀、风味文本…（按 / 聚焦）" aria-label="搜索物品">
      <kbd>/</kbd>
    </div>
    <select class="sel" id="sort" aria-label="排序"></select>
    <span class="spacer"></span>
    <a class="btn btn-sm" href="about.html#sources">数据说明</a>
  </div>

  <div class="db-layout">
    <aside class="facets" id="side" aria-label="筛选项"></aside>
    <section class="results" aria-live="polite">
      <div class="results-head"><div id="count"></div><div class="tiny mute" id="hint"></div></div>
      <div id="list"></div>
    </section>
  </div>
</main>

<div id="bo-foot"></div>

<script src="assets/icons/manifest.js"></script>
<script src="assets/data/items.js"></script>
<script src="assets/app.js"></script>
<script src="assets/pages/items.js"></script>
</body>
</html>
