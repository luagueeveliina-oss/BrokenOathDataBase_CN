<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>技能与宝石 · Broken Oath Data Base</title>
<meta name="description" content="《破誓》技能数据库：78 个技能宝石、93 个辅助宝石、33 个誓约、14 个灾祸，以及 18 份开荒构筑指南。">
<link rel="stylesheet" href="assets/app.css">
<script>try{var t=localStorage.getItem('bo_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body class="page-skills">
<a class="skip-link" href="#main">跳到正文</a>
<header id="bo-top"></header>

<main id="main" class="wrap">
  <header class="pagehead">
    <div class="crumbs"><a href="index.html">首页</a><span class="sep">/</span><span>数据库</span><span class="sep">/</span><span>技能</span></div>
    <div class="ph-kicker">Gems &amp; skills</div>
    <div class="ph-row">
      <div>
        <h1 class="ph-title">技能与宝石 <span class="thin">Skills</span></h1>
        <p class="ph-sub">技能宝石、辅助宝石、誓约与灾祸的完整数值与标签，附 18 份官方开荒构筑指南，可一键送入模拟器。</p>
      </div>
      <div class="ph-actions"><span class="tag gold" id="skillVer">本地数据</span></div>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="技能分类"></nav>

  <div class="toolbar">
    <div class="searchbox">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="搜索技能、辅助、标签…（按 / 聚焦）" aria-label="搜索技能">
      <kbd>/</kbd>
    </div>
    <select class="sel" id="sort" aria-label="排序">
      <option value="name">按名称</option>
      <option value="lvl">按等级需求</option>
      <option value="cls">按职业</option>
    </select>
    <span class="spacer"></span>
    <span class="tiny muted" id="resultCount">—</span>
  </div>

  <div class="db-layout">
    <aside class="facets" id="side" aria-label="筛选项"></aside>
    <section class="results" aria-live="polite">
      <div class="results-head"><div id="count"></div><div class="tiny mute">点击卡片查看完整数值</div></div>
      <div id="list"></div>
    </section>
  </div>
</main>

<div id="bo-foot"></div>

<script src="assets/icons/manifest.js"></script>
<script src="assets/data/skills.js"></script>
<script src="assets/app.js"></script>
<script src="assets/pages/skills.js"></script>
</body>
</html>
