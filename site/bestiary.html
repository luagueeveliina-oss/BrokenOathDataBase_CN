<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>怪物图鉴 · Broken Oath Data Base</title>
<meta name="description" content="《破誓》382 种怪物、28 位守护者与裂隙首领机制：生命、伤害、经验、抗性、变体与阶段。">
<link rel="stylesheet" href="assets/app.css">
<script>try{var t=localStorage.getItem('bo_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>
<header id="bo-top"></header>

<main id="main" class="wrap">
  <header class="pagehead">
    <div class="crumbs"><a href="index.html">首页</a><span class="sep">/</span><span>数据库</span><span class="sep">/</span><span>图鉴</span></div>
    <div class="ph-kicker">Bestiary</div>
    <div class="ph-row">
      <div>
        <h1 class="ph-title">怪物图鉴 <span class="thin">Bestiary</span></h1>
        <p class="ph-sub">382 种怪物、28 位守护者，以及裂隙里会遇见的首领机制。生命、伤害、经验与抗性均来自游戏数据文件。</p>
      </div>
      <div class="ph-actions"><span class="tag gold" id="mobVer">本地数据</span></div>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="图鉴分类"></nav>

  <div class="toolbar">
    <div class="searchbox">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="搜索怪物、守护者、机制…（按 / 聚焦）" aria-label="搜索图鉴">
      <kbd>/</kbd>
    </div>
    <select class="sel" id="sort" aria-label="排序">
      <option value="life">生命：高到低</option>
      <option value="dmg">伤害：高到低</option>
      <option value="xp">经验：高到低</option>
      <option value="name">名称</option>
    </select>
    <span class="spacer"></span>
    <span class="tiny muted" id="resultCount">—</span>
  </div>

  <div class="db-layout">
    <aside class="facets" id="side" aria-label="筛选项"></aside>
    <section class="results" aria-live="polite">
      <div class="results-head"><div id="count"></div><div class="tiny mute" id="hint"></div></div>
      <div id="list"></div>
      <div id="pager"></div>
    </section>
  </div>
</main>

<div id="bo-foot"></div>

<script src="assets/icons/manifest.js"></script>
<script src="assets/data/bestiary.js"></script>
<script src="assets/app.js"></script>
<script src="assets/pages/bestiary.js"></script>
</body>
</html>
