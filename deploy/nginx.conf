# /etc/nginx/conf.d/brokenoath-db.conf
# 用法：把 site/ 整个目录上传到 /var/www/brokenoath-db，然后 nginx -t && systemctl reload nginx
#
# 证书：certbot --nginx -d db.yourdomain.com
# 说明：本站是纯静态、无后端、无 SPA 路由（深链用的是 #hash），所以不需要 try_files 回退到 index.html。

server {
    listen 80;
    listen [::]:80;
    server_name db.yourdomain.com;

    root /var/www/brokenoath-db;
    index index.html;
    charset utf-8;

    # ---- 压缩（体积从 1.8 MB 降到 ~350 KB）----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               image/svg+xml application/xml;

    # 有 brotli 模块时再开（比 gzip 再小 ~20%）
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 缓存策略 ----
    # 页面：每次都校验，保证数据更新后立刻生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # 数据与样式：缓存 1 小时
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 隐藏文件
    location ~ /\. {
        deny all;
    }
}
